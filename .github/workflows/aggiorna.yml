name: Aggiorna calendario

on:
  schedule:
    # Ogni due ore. Non per leggere dodici volte la fonte, ma per avere dodici
    # occasioni: il filtro anti-bot del sito respinge un runner per volta e a
    # caso, e ogni esecuzione parte da un indirizzo diverso. Appena una riesce,
    # le successive vedono il calendario fresco (FRESCO in genera_ics.py) ed
    # escono senza chiedere niente: su una giornata normale la fonte viene
    # letta una volta sola.
    - cron: "7 */2 * * *"
  workflow_dispatch:          # avvio manuale dal sito
    inputs:
      forza:
        description: "1 = leggi comunque la fonte; 0 = comportati come un'esecuzione programmata"
        default: "1"
        type: string
  push:
    branches: [main]

permissions:
  contents: write

concurrency:                  # niente due esecuzioni sovrapposte sullo stesso file
  group: aggiorna-calendario
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIVO: ${{ secrets.HEALTHCHECK_URL }}   # facoltativo, vedi README
      EVENTO: ${{ github.event_name }}
      FORZA_CHIESTA: ${{ inputs.forza }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prove
        run: python -B -W error prova_genera_ics.py

      - name: Genera livorno.ics
        # Le esecuzioni programmate rispettano il risparmio della fonte: se il
        # calendario e' fresco non parte nessuna richiesta. Un avvio manuale o un
        # push vogliono una lettura vera e la forzano, tranne se si chiede
        # esplicitamente "forza=0" per provare il comportamento programmato.
        run: |
          if [ "$EVENTO" != "schedule" ] && [ "$FORZA_CHIESTA" != "0" ]; then
            export FORZA=1
          fi
          echo "evento=$EVENTO forza=${FORZA:-(no)}"
          python genera_ics.py

      - name: Pubblica se e' cambiato
        run: |
          if [ -n "$(git status --porcelain livorno.ics)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add livorno.ics
            git commit -m "Aggiornato calendario partite in casa"
            git push
            echo "calendario aggiornato"
          else
            echo "nessuna modifica"
          fi

      - name: Battito, il calendario e' vivo
        if: success() && env.VIVO != ''
        run: curl -fsS --retry 3 --max-time 20 "$VIVO" -o /dev/null && echo "battito inviato"

      - name: Battito di allarme
        if: failure() && env.VIVO != ''
        run: curl -fsS --retry 3 --max-time 20 "$VIVO/fail" -o /dev/null || true
