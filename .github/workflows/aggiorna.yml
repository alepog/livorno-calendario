name: Aggiorna calendario

on:
  schedule:
    - cron: "0 6 * * *"      # ogni giorno alle 06:00 UTC
  workflow_dispatch:          # avvio manuale dal sito
  push:
    branches: [main]

permissions:
  contents: write

concurrency:                  # niente due esecuzioni sovrapposte sullo stesso file
  group: aggiorna-calendario
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIVO: ${{ secrets.HEALTHCHECK_URL }}   # facoltativo, vedi README
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prove
        run: python -W error prova_genera_ics.py

      - name: Genera livorno.ics
        run: python genera_ics.py

      - name: Pubblica se e' cambiato
        run: |
          if [ -n "$(git status --porcelain livorno.ics)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add livorno.ics
            git commit -m "Aggiornato calendario partite in casa"
            git push
            echo "calendario aggiornato"
          else
            echo "nessuna modifica"
          fi

      - name: Battito, il calendario e' vivo
        if: success() && env.VIVO != ''
        run: curl -fsS --retry 3 --max-time 20 "$VIVO" -o /dev/null && echo "battito inviato"

      - name: Battito di allarme
        if: failure() && env.VIVO != ''
        run: curl -fsS --retry 3 --max-time 20 "$VIVO/fail" -o /dev/null || true
