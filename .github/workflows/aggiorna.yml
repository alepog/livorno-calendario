name: Aggiorna calendario

on:
  schedule:
    - cron: "0 6 * * *"      # ogni giorno alle 06:00 UTC
  workflow_dispatch:          # avvio manuale dal sito
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Genera livorno.ics
        run: python genera_ics.py

      - name: Pubblica se e' cambiato
        run: |
          if [ -n "$(git status --porcelain livorno.ics)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add livorno.ics
            git commit -m "Aggiornato calendario partite in casa"
            git push
            echo "calendario aggiornato"
          else
            echo "nessuna modifica"
          fi
